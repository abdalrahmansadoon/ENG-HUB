name: ENG HUB Worker typecheck

on:
  push:
    branches: [main, master]
    paths:
      - "backend/worker/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "backend/worker/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
