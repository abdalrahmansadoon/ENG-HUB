name: Deploy ENG HUB to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyDWrjLwgj8r5JPWfzbOIAx76MF7ydCLOB8' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'eng-hub-5c30a.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'eng-hub-5c30a' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '366947709379' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:366947709379:web:747b0aba2d08056b734d76' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || 'G-M2MPGMLD14' }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY || 'BL5AUknwn5hrfgrFiFPjeSf2S9Dj9QZpEEyPIfE0KjFf3GbwkfNIaOYr2HxWywqpdfq6UV1JmUzNWE_kMVrSAAQ' }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY || '' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Use a project-specific artifact name so old/retried Pages artifacts
      # cannot make deploy-pages select multiple "github-pages" artifacts.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: eng-hub-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: eng-hub-pages-${{ github.run_id }}-${{ github.run_attempt }}
